services:
  postgres:
    image: postgres:17.6-alpine
    env_file: .local/database.env
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paid_content -d paid_content"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  data:
